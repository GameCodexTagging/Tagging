<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>White vs Blue</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#587584}
#setupPage{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#workspace{display:none;width:100%;height:100%;background:#587584}
#gameLog{width:34%;min-width:240px;max-width:75%;height:100%;background:#fff;display:flex;flex-direction:column}
#logHead{height:52px;flex:0 0 52px;background:#263e4b;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;cursor:pointer;user-select:none}
#logHead strong{font-size:17px;white-space:nowrap}
#gameLogDelete{border:0;border-radius:7px;background:#d71920;color:#fff;font-weight:900;padding:9px 14px;cursor:pointer;margin-left:10px}
#gameLogDelete:active{transform:translateY(1px)}
#gameLogPdfSave{border:0;border-radius:7px;background:#455a64;color:#fff;font-weight:900;padding:9px 14px;cursor:pointer;margin-left:7px}
#gameLogPdfSave:active{transform:translateY(1px)}
#liveStatsBox{display:flex;align-items:center;min-width:0;margin:0 10px;cursor:default}
#liveStatsBox #liveGameId.live-game-id-green{font-size:15px;font-weight:900;white-space:nowrap;color:#19a34a;opacity:1;background:transparent;border:0;padding:0}

#logCount{font-size:12px;font-weight:700;opacity:.8}
#logScroll{flex:1;min-height:0;overflow:auto;background:#fff}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{position:sticky;top:0;z-index:2;background:#eef3f5;color:#52646b;border-bottom:1px solid #b9cbd3;padding:8px 7px;text-align:left;font-size:10px;white-space:nowrap}
tbody td{padding:8px 7px;border-bottom:1px solid #e2e8eb;vertical-align:top}
tbody tr:nth-child(even){background:#f8fafb}
.cat{font-weight:900;color:#203640}
.time{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
.desc{color:#52646b;line-height:1.35}
.player{font-weight:900;text-align:center}
.edit-cell{cursor:pointer;border:2px solid transparent;border-radius:5px;padding:8px 10px;min-height:40px;box-sizing:border-box;font-weight:800;touch-action:manipulation;-webkit-tap-highlight-color:rgba(27,134,200,.18)}
.edit-cell:hover{border-color:#1b86c8;background:#edf8fd}
.edit-cell.selected{border-color:#e31b23;background:#fff1f1;box-shadow:0 0 0 2px #e31b2333}
.descriptor-list{display:flex;flex-wrap:wrap;gap:5px}
.score-cell{font-weight:900;text-align:center;min-width:62px;font-variant-numeric:tabular-nums;color:#17242a;background:#f4f8fa;border-radius:6px;padding:5px 7px}
.score-cell.goal-score{background:#fff3b0;border:2px solid #d1ad00;color:#17242a}
.player-cell{font-weight:900;text-align:center;min-width:58px;min-height:42px;cursor:pointer;border:2px solid transparent;border-radius:6px;padding:8px 10px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;touch-action:manipulation;-webkit-tap-highlight-color:rgba(27,134,200,.18)}
.player-cell:hover{border-color:#1b86c8;background:#edf8fd}
.player-cell.selected{border-color:#e31b23;background:#fff1f1;box-shadow:0 0 0 2px #e31b2333}
.descriptor-chip{display:inline-flex;align-items:center;min-height:40px;box-sizing:border-box;cursor:pointer;border:2px solid #b9cbd3;border-radius:6px;padding:7px 10px;font-weight:800;background:#fff;touch-action:manipulation;-webkit-tap-highlight-color:rgba(27,134,200,.18)}
.descriptor-chip:hover{border-color:#1b86c8;background:#edf8fd}
.descriptor-chip.selected{border-color:#e31b23;background:#fff1f1;box-shadow:0 0 0 2px #e31b2333}
.tag-number{cursor:pointer;font-weight:900;border:2px solid transparent;border-radius:6px;padding:8px;min-height:40px;box-sizing:border-box;text-align:center;touch-action:manipulation;-webkit-tap-highlight-color:rgba(27,134,200,.18)}
.tag-number:hover{border-color:#1b86c8;background:#edf8fd}
.tag-number.selected{border-color:#e31b23;background:#fff1f1;box-shadow:0 0 0 2px #e31b2333}
#empty{padding:24px 14px;color:#71838c;text-align:center;font-weight:700}
#divider{flex:0 0 14px;width:14px;height:100%;background:#263e4b;cursor:col-resize;position:relative;touch-action:none;user-select:none}
#divider::before{content:'';position:absolute;left:5px;top:50%;transform:translateY(-50%);width:4px;height:64px;border-radius:4px;background:#d8e1e5}
#divider.dragging{background:#172a34}
#fullWrap{
  flex:1;min-width:240px;height:100%;background:#587584;
  padding:10px;display:flex;flex-direction:column;min-height:0
}
#fullBox{
  flex:1;min-height:0;background:#fff;
  border:3px solid #263e4b;border-radius:12px;
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 2px 8px rgba(0,0,0,.22)
}
#fullBoxHead{
  min-height:64px;flex:0 0 auto;background:#263e4b;color:#fff;
  display:flex;align-items:center;gap:12px;padding:7px 14px;
  font-size:16px;font-weight:900;letter-spacing:.3px;flex-wrap:wrap
}
#fullBoxHead .full-title{white-space:nowrap}
.full-mode-switch{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.full-mode{border:2px solid #8aa1ad;border-radius:8px;background:#405c6a;color:#fff;font-weight:900;font-size:12px;padding:7px 10px;cursor:pointer}
.full-mode.active{background:#ffef1a;color:#111;border-color:#fff}
.full-mode:active{transform:translateY(1px)}
.quick-descriptor-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:2px solid #8aa1ad;border-radius:10px;padding:6px 8px;background:#172a34}
.quick-descriptor{border:2px solid #aabcc5;border-radius:8px;background:#eef3f5;color:#17242a;font-weight:900;font-size:14px;min-height:42px;padding:9px 14px;cursor:pointer;white-space:nowrap;touch-action:manipulation}
.quick-descriptor[data-descriptor="VAR"]{background:#d71920;color:#fff;border-color:#ff6b70}
.quick-descriptor[data-descriptor="5 ON 5"]{background:#ffdf24;color:#111;border-color:#fff07a}
.quick-descriptor[data-descriptor="RED CARD"]{background:#d71920;color:#fff;border-color:#ff6b70}
.quick-descriptor:active{transform:translateY(1px);filter:brightness(.9)}
#fullPage{width:100%;flex:1;min-height:0;border:0;display:block;background:#587584}
@media(max-width:900px){
  #gameLog{width:38%;min-width:280px}
  table{font-size:11px}
  thead th,tbody td{padding:6px 5px}
}
</style>
</head>
<body>
<iframe id="setupPage" title="White vs Blue Setup"></iframe>

<div id="workspace">
  <section id="gameLog">
    <div id="logHead" title="Back to Game Codex">
      <strong>WHITE vs BLUE</strong>
      <button id="gameLogDelete" type="button" title="Delete selected tag or descriptor">DELETE</button><button id="gameLogPdfSave" type="button" title="Save Game Log as non-editable PDF">PDF SAVE</button><div id="liveStatsBox" title="Live Stats Game ID">
        <span id="liveGameId" class="live-game-id-green"></span>
      </div>
      <span id="logCount">0 TAGS</span>
    </div>
    <div id="logScroll">
      <div id="empty">No tags yet.</div>
      <table id="logTable" style="display:none">
        <thead>
          <tr>
            <th>#</th>
            <th>START</th>
            <th>END</th>
            <th>CATEGORY</th>
            <th>SCORE</th>
            <th>PLAYER</th>
            <th>DESCRIPTORS</th>
            
          </tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>
  </section>

  <div id="divider" role="separator" aria-orientation="vertical" aria-label="Resize Game Log and Full Tagging"></div>

  <section id="fullWrap">
    <div id="fullBox">
      <div id="fullBoxHead">
  <span class="full-title">WHITE vs BLUE</span>
  <div class="full-mode-switch">
    <button id="modeWithPlayers" class="full-mode active" type="button">WITH PLAYERS</button>
    <button id="modeWithoutPlayers" class="full-mode" type="button">WITHOUT PLAYERS</button>
  </div>
  <div class="quick-descriptor-box" id="quickDescriptorBox" aria-label="Quick descriptors">
    <button class="quick-descriptor" type="button" data-descriptor="TIME OUT">TIME OUT</button>
    <button class="quick-descriptor" type="button" data-descriptor="VAR">VAR</button>
    <button class="quick-descriptor" type="button" data-descriptor="5 ON 5">5 ON 5</button>
    <button class="quick-descriptor" type="button" data-descriptor="RED CARD">RED CARD</button>
    <button class="quick-descriptor" type="button" data-descriptor="BRUTALITY">BRUTALITY</button>
  </div>
</div>
      <iframe id="fullPage" title="White vs Blue"></iframe>
    </div>
  </section>
</div>

<script>
function decode64(v){
  const bytes=Uint8Array.from(atob(v),c=>c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}
function fmt(v){
  v=Math.max(0,Math.floor(Number(v)||0));
  return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0');
}

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const setup=document.getElementById("setupPage");
const workspace=document.getElementById("workspace");
const full=document.getElementById("fullPage");
const modeWithPlayers=document.getElementById("modeWithPlayers");
const modeWithoutPlayers=document.getElementById("modeWithoutPlayers");
let fullPlayerMode=true;
document.querySelectorAll(".quick-descriptor").forEach(btn=>{
  btn.addEventListener("click",(e)=>{
    e.preventDefault();
    e.stopPropagation();
    if(full.contentWindow)full.contentWindow.postMessage({
      type:"ADD_QUICK_DESCRIPTOR",
      name:btn.dataset.descriptor
    },"*");
  });
});
function setFullPlayerMode(withPlayers){
  fullPlayerMode=!!withPlayers;
  if(modeWithPlayers)modeWithPlayers.classList.toggle("active",fullPlayerMode);
  if(modeWithoutPlayers)modeWithoutPlayers.classList.toggle("active",!fullPlayerMode);
  try{
    if(full.contentWindow)full.contentWindow.postMessage({
      type:"SET_FULL_TAGGING_PLAYER_MODE",
      withPlayers:fullPlayerMode
    },"*");
  }catch(_){}
}
if(modeWithPlayers)modeWithPlayers.addEventListener("click",()=>setFullPlayerMode(true));
if(modeWithoutPlayers)modeWithoutPlayers.addEventListener("click",()=>setFullPlayerMode(false));
full.addEventListener("load",()=>{setFullPlayerMode(fullPlayerMode);setTimeout(syncStatsTeamNames,0)});

function openWorkspace(){
  setup.style.display="none";
  workspace.style.display="flex";
}

function openGameCodex(){
  // Show the actual GAME CODEX SETUP page (the page with Tournament,
  // Game Type, Teams & Rosters), but keep the running project alive.
  try{
    if(setup.contentWindow && typeof setup.contentWindow.reopenSetup==="function"){
      setup.contentWindow.reopenSetup();
    }
  }catch(_){}
  workspace.style.display="none";
  setup.style.display="block";
}

// GAME LOG -> GAME CODEX SETUP page. The running project is only hidden.
document.getElementById("logHead").addEventListener("click",openGameCodex);

const liveGameId=document.getElementById("liveGameId");
const liveStatsBox=document.getElementById("liveStatsBox");

// GAME LOG is display-only: only the ID text is shown in green.
["click","pointerdown"].forEach(type=>{
  liveStatsBox.addEventListener(type,(e)=>e.stopPropagation());
});

function showLiveGameId(raw){
  const gameId=String(raw||"").trim();
  liveGameId.textContent=gameId;
  try{ if(full.contentWindow) full.contentWindow.postMessage({type:"SET_LIVE_STATS_GAME_ID",gameId},"*"); }catch(_){}
}

function syncStatsTeamNames(){
  try{
    const sd=setup.contentDocument;
    if(!sd)return;
    const whiteName=String(sd.getElementById("su-nameA")?.value||"WHITE").trim()||"WHITE";
    const blueName=String(sd.getElementById("su-nameB")?.value||"BLUE").trim()||"BLUE";
    const playersA=[],playersB=[];
    for(let i=0;i<15;i++){
      playersA.push({
        num:String(sd.getElementById("rp-A-"+i+"-num")?.value||"").trim(),
        name:String(sd.getElementById("rp-A-"+i+"-name")?.value||"").trim()
      });
      playersB.push({
        num:String(sd.getElementById("rp-B-"+i+"-num")?.value||"").trim(),
        name:String(sd.getElementById("rp-B-"+i+"-name")?.value||"").trim()
      });
    }
    if(full.contentWindow) full.contentWindow.postMessage({
      type:"SET_STATS_TEAM_NAMES",
      whiteName:whiteName,
      blueName:blueName,
      playersA:playersA,
      playersB:playersB
    },"*");
  }catch(_){}
}

setup.addEventListener("load",()=>{
  const doc=setup.contentDocument;
  if(!doc) return;

  const setupWhiteName=doc.getElementById("su-nameA");
  const setupBlueName=doc.getElementById("su-nameB");
  [setupWhiteName,setupBlueName].forEach(el=>{
    if(!el)return;
    el.addEventListener("input",syncStatsTeamNames);
    el.addEventListener("change",syncStatsTeamNames);
  });
  const setupRosterGrid=doc.getElementById("rosterGrid");
  if(setupRosterGrid){
    setupRosterGrid.addEventListener("input",syncStatsTeamNames);
    setupRosterGrid.addEventListener("change",syncStatsTeamNames);
  }
  syncStatsTeamNames();

  const setupGameId=doc.getElementById("su-gameid");
  if(setupGameId){
    showLiveGameId(setupGameId.value);
    setupGameId.addEventListener("input",()=>showLiveGameId(setupGameId.value));
    setupGameId.addEventListener("change",()=>showLiveGameId(setupGameId.value));
  }

  const start=doc.getElementById("su-start");
  if(start){
    start.addEventListener("click",()=>{
      const existing=doc.getElementById("su-gameid")?.value || "";
      showLiveGameId(existing);
      syncStatsTeamNames();
      setTimeout(openWorkspace,0);
    });
  }

  // The blue "Game Codex" title on the SETUP page -> GAME LOG + FULL TAGGING.
  const setupTitle=doc.querySelector(".setup-title");
  if(setupTitle){
    setupTitle.style.cursor="pointer";
    setupTitle.title="Back to Game Log";
    setupTitle.addEventListener("click",(e)=>{
      e.preventDefault();
      e.stopPropagation();
      openWorkspace();
    });
  }

  // Keep the app-page Game Codex title useful too: first show Setup.
  const appTitle=doc.querySelector(".app-title");
  if(appTitle){
    appTitle.title="Back to Game Codex setup";
  }
});

const divider=document.getElementById("divider");
const gameLog=document.getElementById("gameLog");
let resizing=false;

function resizePanels(clientX){
  const total=workspace.getBoundingClientRect();
  const dividerWidth=divider.getBoundingClientRect().width || 14;
  const minLeft=240;
  const minRight=240;
  const maxLeft=Math.max(minLeft,total.width-dividerWidth-minRight);
  const newLeft=Math.max(minLeft,Math.min(maxLeft,clientX-total.left));
  gameLog.style.width=newLeft+"px";
  gameLog.style.flex="0 0 "+newLeft+"px";
}

divider.addEventListener("pointerdown",(e)=>{
  resizing=true;
  divider.classList.add("dragging");
  try{ divider.setPointerCapture(e.pointerId); }catch(_){}
  resizePanels(e.clientX);
});
divider.addEventListener("pointermove",(e)=>{
  if(!resizing) return;
  resizePanels(e.clientX);
});
function stopResize(e){
  if(!resizing) return;
  resizing=false;
  divider.classList.remove("dragging");
  try{ divider.releasePointerCapture(e.pointerId); }catch(_){}
}
divider.addEventListener("pointerup",stopResize);
divider.addEventListener("pointercancel",stopResize);

let selectedLogEdit=null;

function gameLogPdfEsc(v){
  return String(v??'')
    .replace(/[^\x20-\x7E]/g,'?')
    .replace(/([\\()])/g,'\\$1');
}
function gameLogPdfFmtTime(sec){
  sec=Math.max(0,Number(sec)||0);
  const m=Math.floor(sec/60), s=Math.floor(sec%60);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function saveGameLogPDF(){
  // Read directly from the visible GAME LOG table.
  // This guarantees the PDF contains every row and every value currently shown in GAME LOG.
  const trs=Array.from(document.querySelectorAll("#logBody tr"));
  const data=trs.map(tr=>{
    const td=Array.from(tr.querySelectorAll("td"));
    return {
      no:String(td[0]?.innerText||td[0]?.textContent||"").trim(),
      start:String(td[1]?.innerText||td[1]?.textContent||"").trim(),
      end:String(td[2]?.innerText||td[2]?.textContent||"").trim(),
      category:String(td[3]?.innerText||td[3]?.textContent||"").trim(),
      score:String(td[4]?.innerText||td[4]?.textContent||"").trim(),
      player:String(td[5]?.innerText||td[5]?.textContent||"").trim(),
      descriptors:String(td[6]?.innerText||td[6]?.textContent||"").trim()
    };
  });

  let gameId="";
  try{
    const sd=setup && setup.contentDocument;
    gameId=String(sd?.getElementById("su-gameid")?.value||"").trim();
  }catch(_){}
  if(!gameId) gameId=String(document.getElementById("liveGameId")?.textContent||"").trim();

  const W=792,H=612;
  const xs=[28,56,106,156,292,342,390];
  const maxChars=[4,8,8,22,8,8,58];

  function wrapText(v,max){
    const text=String(v||"").replace(/\s+/g," ").trim();
    if(!text)return [""];
    const words=text.split(" ");
    const lines=[]; let line="";
    words.forEach(word=>{
      if(word.length>max){
        if(line){lines.push(line);line="";}
        for(let p=0;p<word.length;p+=max)lines.push(word.slice(p,p+max));
      }else if(!line) line=word;
      else if((line+" "+word).length<=max) line+=" "+word;
      else {lines.push(line);line=word;}
    });
    if(line)lines.push(line);
    return lines.length?lines:[""];
  }

  const prepared=data.map(r=>{
    const cells=[
      wrapText(r.no,maxChars[0]),
      wrapText(r.start,maxChars[1]),
      wrapText(r.end,maxChars[2]),
      wrapText(r.category,maxChars[3]),
      wrapText(r.score,maxChars[4]),
      wrapText(r.player,maxChars[5]),
      wrapText(r.descriptors,maxChars[6])
    ];
    return {cells,height:Math.max(18,Math.max(...cells.map(x=>x.length))*10+6)};
  });

  // Split ALL Game Log rows across as many PDF pages as required.
  const pages=[]; let page=[], used=0;
  const available=470;
  prepared.forEach(r=>{
    if(page.length && used+r.height>available){
      pages.push(page); page=[]; used=0;
    }
    page.push(r); used+=r.height;
  });
  if(page.length || !pages.length) pages.push(page);

  const objs=[null];
  const add=body=>{objs.push(body);return objs.length-1};
  const font=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>");
  const fontB=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>");
  const pageIds=[],contentIds=[];

  pages.forEach((pageRows,pageIndex)=>{
    let s="BT\n/F2 16 Tf\n28 578 Td\n(GAME LOG) Tj\n";
    s+="/F1 9 Tf\n0 -17 Td\n("+gameLogPdfEsc(gameId?"LIVE STATS GAME ID: "+gameId:"")+") Tj\nET\n";
    const yHead=536;
    s+="0.92 g\n28 "+yHead+" 736 22 re f\n0 g\nBT\n/F2 8 Tf\n";
    ["#","START","END","CATEGORY","SCORE","PLAYER","DESCRIPTORS"].forEach((h,i)=>{
      s+="1 0 0 1 "+(xs[i]+4)+" "+(yHead+7)+" Tm\n("+h+") Tj\n";
    });
    s+="ET\n";

    let y=yHead-15;
    pageRows.forEach(r=>{
      const rowBottom=y-r.height+14;
      s+="0.82 G\n28 "+rowBottom+" m 764 "+rowBottom+" l S\n0 G\n";
      r.cells.forEach((lines,i)=>{
        lines.forEach((line,li)=>{
          s+="BT\n/F1 7.5 Tf\n1 0 0 1 "+(xs[i]+4)+" "+(y-li*10)+" Tm\n("+gameLogPdfEsc(line)+") Tj\nET\n";
        });
      });
      y-=r.height;
    });

    s+="BT\n/F1 7 Tf\n1 0 0 1 28 18 Tm\n(Page "+(pageIndex+1)+" of "+pages.length+" - "+data.length+" total tags) Tj\nET\n";
    const content=add("<< /Length "+s.length+" >>\nstream\n"+s+"endstream");
    contentIds.push(content);
    pageIds.push(add(""));
  });

  const pagesObj=add("");
  pageIds.forEach((pid,i)=>{
    objs[pid]="<< /Type /Page /Parent "+pagesObj+" 0 R /MediaBox [0 0 "+W+" "+H+"] /Resources << /Font << /F1 "+font+" 0 R /F2 "+fontB+" 0 R >> >> /Contents "+contentIds[i]+" 0 R >>";
  });
  objs[pagesObj]="<< /Type /Pages /Kids ["+pageIds.map(id=>id+" 0 R").join(" ")+"] /Count "+pageIds.length+" >>";
  const catalog=add("<< /Type /Catalog /Pages "+pagesObj+" 0 R >>");

  let pdf="%PDF-1.4\n"; const offsets=[0];
  for(let i=1;i<objs.length;i++){
    offsets[i]=pdf.length;
    pdf+=i+" 0 obj\n"+objs[i]+"\nendobj\n";
  }
  const xref=pdf.length;
  pdf+="xref\n0 "+objs.length+"\n0000000000 65535 f \n";
  for(let i=1;i<objs.length;i++)pdf+=String(offsets[i]).padStart(10,"0")+" 00000 n \n";
  pdf+="trailer\n<< /Size "+objs.length+" /Root "+catalog+" 0 R >>\nstartxref\n"+xref+"\n%%EOF";

  const blob=new Blob([pdf],{type:"application/pdf"});
  const safe=(gameId||"Game_Log").replace(/[\\/:*?"<>|]+/g,"_").trim()||"Game_Log";
  const filename=safe+"_Game_Log.pdf";

  try{
    if(window.Android && typeof window.Android.saveBase64File==="function"){
      const reader=new FileReader();
      reader.onloadend=()=>{
        const b64=String(reader.result||"").split(",")[1]||"";
        window.Android.saveBase64File(filename,"application/pdf",b64);
      };
      reader.readAsDataURL(blob);
      return;
    }
  }catch(_){}

  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

document.getElementById("gameLogPdfSave").addEventListener("click",(e)=>{
  e.preventDefault();
  e.stopPropagation();
  saveGameLogPDF();
});

document.getElementById("gameLogDelete").addEventListener("click",(e)=>{
  e.preventDefault();
  e.stopPropagation();
  if(!selectedLogEdit) return;
  if(full.contentWindow){
    full.contentWindow.postMessage({
      type:"DELETE_FULL_TAG_SELECTION",
      id:selectedLogEdit.id,
      field:selectedLogEdit.field,
      descriptorIndex:selectedLogEdit.descriptorIndex,
      descriptorName:selectedLogEdit.descriptorName||"",
      descriptorType:selectedLogEdit.descriptorType||""
    },"*");
  }
  selectedLogEdit=null;
  document.querySelectorAll(".edit-cell.selected,.descriptor-chip.selected,.tag-number.selected,.edit-player.selected")
    .forEach(x=>x.classList.remove("selected"));
});


function setLogEdit(id,field,cell,descriptorIndex=null,descriptorName="",descriptorType=""){
  const same=selectedLogEdit &&
    selectedLogEdit.id===id &&
    selectedLogEdit.field===field &&
    String(selectedLogEdit.descriptorIndex??'')===String(descriptorIndex??'');
  document.querySelectorAll(".edit-cell.selected,.descriptor-chip.selected,.tag-number.selected,.edit-player.selected").forEach(x=>x.classList.remove("selected"));
  if(same){
    selectedLogEdit=null;
    if(full.contentWindow)full.contentWindow.postMessage({type:"SET_GAME_LOG_EDIT",id:null,field:null},"*");
    return;
  }
  selectedLogEdit={id,field,descriptorIndex,descriptorName,descriptorType};
  cell.classList.add("selected");
  if(full.contentWindow)full.contentWindow.postMessage({
    type:"SET_GAME_LOG_EDIT",id,field,descriptorIndex
  },"*");
}

window.addEventListener("message",(ev)=>{
  const d=ev.data;

  if(d && d.type==="GAME_LOG_EDIT_COMPLETE"){
    selectedLogEdit=null;
    document.querySelectorAll(".edit-cell.selected,.descriptor-chip.selected,.tag-number.selected,.edit-player.selected")
      .forEach(x=>x.classList.remove("selected"));
    return;
  }

  if(d && d.type==="XML_FILENAME_GAME_ID"){
    const gameId=String(d.gameId||"").trim();
    if(gameId){
      showLiveGameId(gameId);
      try{
        const sd=setup.contentDocument;
        if(sd){
          const su=sd.getElementById("su-gameid");
          const ig=sd.getElementById("ig-gameid");
          if(su)su.value=gameId;
          if(ig)ig.value=gameId;
        }
      }catch(_){}
    }
    return;
  }

  if(!d || d.type!=="FULL_TAGGING_STATE" || !Array.isArray(d.events)) return;

  // SCORE is recalculated from the CURRENT categories on every state update.
  // Editing/deleting a GOALS tag therefore automatically removes that point
  // and recalculates every later goal score.
  const chronological=d.events.slice().sort((a,b)=>{
    const ap=Number(a.press)||Number(a.start)||0;
    const bp=Number(b.press)||Number(b.start)||0;
    if(ap!==bp)return ap-bp;
    return String(a.id||'').localeCompare(String(b.id||''));
  });
  let whiteScore=0,blueScore=0;
  const scoreById=new Map();
  chronological.forEach(x=>{
    // SCORE is rebuilt from the edited tag data every time.
    // A WHITE/BLUE GOALS category is a goal unless its SHOT RESULT was edited
    // to a non-goal. A WHITE/BLUE SHOT edited to SHOT RESULT=GOALS becomes a goal.
    const category=String(x.category||"").toUpperCase();
    const shotResults=(x.descriptors||[])
      .filter(d=>d&&d.type==="SHOT")
      .map(d=>String(d.name||"").toUpperCase());
    const hasShotResult=shotResults.length>0;
    const resultIsGoal=shotResults.includes("GOALS");

    let goalSide=null;
    if(category==="WHITE GOALS" && (!hasShotResult || resultIsGoal)) goalSide="WHITE";
    else if(category==="BLUE GOALS" && (!hasShotResult || resultIsGoal)) goalSide="BLUE";
    else if(category==="WHITE SHOT" && resultIsGoal) goalSide="WHITE";
    else if(category==="BLUE SHOT" && resultIsGoal) goalSide="BLUE";

    if(goalSide==="WHITE") whiteScore++;
    else if(goalSide==="BLUE") blueScore++;

    // Never leave SCORE blank: every Game Log row shows the running result
    // after that event. Editing a goal therefore visibly subtracts/adds 1
    // instead of making the result disappear.
    scoreById.set(String(x.id),whiteScore+"-"+blueScore);
  });
  const events=chronological.slice().reverse();
  const body=document.getElementById("logBody");
  const table=document.getElementById("logTable");
  const empty=document.getElementById("empty");
  document.getElementById("logCount").textContent=events.length+" TAG"+(events.length===1?"":"S");

  if(!events.length){
    body.innerHTML="";
    table.style.display="none";
    empty.style.display="block";
    selectedLogEdit=null;
    return;
  }

  empty.style.display="none";
  table.style.display="table";

  body.innerHTML=events.map((x,i)=>{
    const descriptors=(x.descriptors||[])
      .filter(d=>d && d.type!=="PLAYER" && d.name);
    const playerDescriptor=(x.descriptors||[]).find(d=>d && d.type==="PLAYER" && d.name);
    const player=String(x.player||playerDescriptor?.name||"").trim();
    const id=String(x.id);
    const catSelected=selectedLogEdit&&selectedLogEdit.id===id&&selectedLogEdit.field==="category";
    const descriptorHtml=descriptors.length
      ? descriptors.map((d,di)=>{
          const selected=selectedLogEdit&&selectedLogEdit.id===id&&
            selectedLogEdit.field==="descriptors"&&Number(selectedLogEdit.descriptorIndex)===di;
          const linkedPlayer=(d&&d.linkedPlayer)?String(d.linkedPlayer).trim():"";
          const displayName=String(d.name||"")+(linkedPlayer?(" "+linkedPlayer):"");
          return `<span class="descriptor-chip${selected?' selected':''}" data-field="descriptors" data-descriptor-index="${di}" data-descriptor-name="${esc(d.name)}" data-descriptor-type="${esc(d.type||'')}">${esc(displayName)}</span>`;
        }).join("")
      : '<span class="muted">—</span>';
    return `<tr data-event-id="${esc(id)}">
      <td><div class="tag-number${selectedLogEdit&&selectedLogEdit.id===id&&selectedLogEdit.field==='addDescriptor'?' selected':''}" data-field="addDescriptor">${events.length-i}</div></td>
      <td>${esc(fmt(x.start))}</td>
      <td>${esc(fmt(x.end))}</td>
      <td><div class="edit-cell${catSelected?' selected':''}" data-field="category">${esc(x.category)}</div></td>
      <td><div class="score-cell${(/ GOALS$/.test(String(x.category||''))||((x.descriptors||[]).some(d=>d&&d.type==='SHOT'&&String(d.name||'').toUpperCase()==='GOALS')))?' goal-score':''}">${esc(scoreById.get(id)||'0-0')}</div></td>
      <td><div class="player-cell edit-player${selectedLogEdit&&selectedLogEdit.id===id&&selectedLogEdit.field==='player'?' selected':''}" data-field="player">${player?esc(player):'—'}</div></td>
      <td><div class="descriptor-list">${descriptorHtml}</div></td>
    </tr>`;
  }).join("");
});


window.addEventListener("message",(ev)=>{
  const d=ev.data;
  if(!d || d.type!=="REQUEST_DELETE_GAME_LOG_SELECTION") return;
  if(!selectedLogEdit){
    if(full.contentWindow) full.contentWindow.postMessage({
      type:"DELETE_FULL_TAG_SELECTION",id:null,field:null
    },"*");
    return;
  }
  if(full.contentWindow) full.contentWindow.postMessage({
    type:"DELETE_FULL_TAG_SELECTION",
    id:selectedLogEdit.id,
    field:selectedLogEdit.field,
    descriptorIndex:selectedLogEdit.descriptorIndex,
    descriptorName:selectedLogEdit.descriptorName||"",
    descriptorType:selectedLogEdit.descriptorType||""
  },"*");
  selectedLogEdit=null;
  document.querySelectorAll(".edit-cell.selected,.descriptor-chip.selected,.tag-number.selected,.edit-player.selected")
    .forEach(x=>x.classList.remove("selected"));
});

const logBody=document.getElementById("logBody");
let logTouchStart=null;
let suppressLogClickUntil=0;

function selectGameLogTarget(target){
  if(!target)return;
  const row=target.closest("tr[data-event-id]");
  if(!row)return;
  const isDescriptor=target.classList.contains("descriptor-chip");
  const descriptorIndex=isDescriptor ? Number(target.dataset.descriptorIndex) : null;
  const descriptorName=isDescriptor ? String(target.dataset.descriptorName||"") : "";
  const descriptorType=isDescriptor ? String(target.dataset.descriptorType||"") : "";
  setLogEdit(row.dataset.eventId,target.dataset.field,target,descriptorIndex,descriptorName,descriptorType);
}

// Android touch/pen: select on pointer-up immediately instead of waiting for a delayed click.
// A small movement tolerance prevents accidental selection while scrolling the Game Log.
logBody.addEventListener("pointerdown",(e)=>{
  if(e.pointerType!=="touch"&&e.pointerType!=="pen")return;
  const target=e.target.closest(".edit-cell,.descriptor-chip,.tag-number,.edit-player");
  if(!target)return;
  logTouchStart={pointerId:e.pointerId,x:e.clientX,y:e.clientY,target};
},{passive:true});

logBody.addEventListener("pointerup",(e)=>{
  if(!logTouchStart||e.pointerId!==logTouchStart.pointerId)return;
  const dx=e.clientX-logTouchStart.x;
  const dy=e.clientY-logTouchStart.y;
  const target=logTouchStart.target;
  logTouchStart=null;
  if(Math.hypot(dx,dy)>12)return;
  suppressLogClickUntil=Date.now()+600;
  selectGameLogTarget(target);
},{passive:true});

logBody.addEventListener("pointercancel",()=>{logTouchStart=null},{passive:true});

logBody.addEventListener("click",(e)=>{
  if(Date.now()<suppressLogClickUntil)return;
  const target=e.target.closest(".edit-cell,.descriptor-chip,.tag-number,.edit-player");
  selectGameLogTarget(target);
});
</script>

<script id="gc-persistent-left-gamelog-script">
(function(){
  function keepGameLogVisible(){
    const ws=document.getElementById('workspace');
    const gl=document.getElementById('gameLog');
    const div=document.getElementById('divider');
    const fw=document.getElementById('fullWrap');
    if(!ws||!gl)return;
    if(getComputedStyle(ws).display!=='none'){
      gl.style.display='flex';
      gl.style.visibility='visible';
      gl.style.opacity='1';
      if(div){div.style.display='block';div.style.visibility='visible';}
      if(fw){fw.style.display='flex';fw.style.visibility='visible';}
    }
  }
  window.addEventListener('load',keepGameLogVisible);
  window.addEventListener('resize',keepGameLogVisible);
  document.addEventListener('visibilitychange',keepGameLogVisible);
  setInterval(keepGameLogVisible,500);
})();
</script>
